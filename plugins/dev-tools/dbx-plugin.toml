schema_version = 1

[package]
include = ["assets", "ui"]

[dev]
# Windows dev host spawns builds with a \\?\ verbatim cwd that cmd.exe rejects;
# pwsh tolerates it. Same workaround as plugins/s3-sync/dbx-plugin.toml.
ui_build = ["pwsh", "-NoProfile", "-Command", '$p = (Get-Location).ProviderPath -replace "^\\\\\?\\", ""; Set-Location $p; npm run build']
ui_watch = ["pwsh", "-NoProfile", "-Command", '$p = (Get-Location).ProviderPath -replace "^\\\\\?\\", ""; Set-Location $p; npm run build:watch']
